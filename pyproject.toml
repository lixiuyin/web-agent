[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "lixiuyin-webagent"
version = "0.2.0"
description = "Browser-grounded web agent and reproducible evaluation harness for long-horizon failure analysis"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Document parsing uses the cloud OCR cascade (webagent.parser): Marker /
    # MinerU / Paddle over HTTP, with a local PyMuPDF fallback. No local ML model
    # or torch required — configure provider keys via AGENT_*_API_KEY env vars.
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "httpx[socks]>=0.27.0",
    "jsonschema>=4.25.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.scripts]
webagent = "webagent.cli:main"

[project.urls]
Homepage = "https://github.com/lixiuyin/web-agent"
Documentation = "https://github.com/lixiuyin/web-agent#readme"
Issues = "https://github.com/lixiuyin/web-agent/issues"
Repository = "https://github.com/lixiuyin/web-agent.git"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "build>=1.3.0",
    "twine>=6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webagent", "benchmarks"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.obsidian",
    "/browser_profile",
    "/build-*",
    "/dist",
    "/dist-*",
    "/outputs",
    "/.env",
    "/.env.local",
    "/.env.*.local",
]

[tool.webagent.release]
# Frozen public evaluation evidence and explicitly published run bundles are
# tracked for auditability but remain excluded from wheel/sdist builds.
allowed-tracked-prefixes = [
    "outputs/campaigns/v6-final-r7",
    "outputs/runs/qwen-report-figure1-20260902",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Coverage gate is enforced on the unit suite. The integration suite needs a
# real browser and is run with `--no-cov` (see AGENTS.md).
addopts = "--cov=webagent --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: marks tests requiring external services (playwright browser)",
]

[tool.coverage.run]
source = ["webagent"]
branch = true
omit = [
    "src/webagent/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "DTZ",
    "G",
    "LOG",
    "PERF",
    "PIE",
    "RET",
]
ignore = ["E501", "B008", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "build>=1.3.0",
    "twine>=6.2.0",
]
