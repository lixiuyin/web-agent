name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run ruff check src/ benchmarks/ tests/
      - run: uv run ruff format --check src/ benchmarks/ tests/
      - run: uv run mypy src/ benchmarks/
      - run: uv run pytest tests/unit/ -v

  browser:
    name: Chromium (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-14
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - run: uv run pytest tests/integration/ -v --no-cov

  package:
    name: Reproducible wheel and sdist
    runs-on: ubuntu-latest
    needs: [quality, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --extra dev --python 3.13
      - name: Check release source state
        run: uv run python -m webagent.release state --root . --require-clean
      - name: Build twice from one source epoch
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run python -m build --outdir build-one
          uv run python -m build --outdir build-two
      - run: uv run python -m webagent.release artifacts build-one
      - run: uv run python -m webagent.release repro build-one build-two
      - run: uv run twine check build-one/*
      - name: Smoke-test the wheel in isolation
        shell: bash
        run: |
          uv venv .package-smoke --python 3.13
          uv pip install --python .package-smoke/bin/python build-one/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.package-smoke/bin/python" -c "import importlib.resources as r; import webagent; from benchmarks.core import packaged_manifest_path; assert r.files('webagent.schemas').joinpath('run-trace-v8.schema.json').is_file(); assert packaged_manifest_path('open_web_general.json').is_file(); print(webagent.__version__)"
          "$GITHUB_WORKSPACE/.package-smoke/bin/python" -m benchmarks.suites.open_web.runner --help
          cd "$GITHUB_WORKSPACE"
          .package-smoke/bin/webagent --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: build-one/*
          if-no-files-found: error
